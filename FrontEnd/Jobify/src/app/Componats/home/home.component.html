<div class="container">
  <div class="hero">
    <p class="description">Search & Apply For Your New Job</p>

    <h3>
      Find jobs that match your skills and grow your career with Jobify
    </h3>

    <div class="search-box">
      <input type="search" placeholder="Search now for your new job">
      <span class="search-icon">🔍</span>
    </div>
  </div>
</div>

<section class="top-categories">
  <h2>Top Industries</h2>
  <div class="industries-grid">
    <div *ngFor="let ind of indstries" class="industry-card">
      <!-- Use image instead of Font Awesome -->
      <img [src]="getIcon(ind.industryName)" class="industry-icon" alt="{{ind.industryName}} icon">
      <h4>{{ ind.industryName }}</h4>
      <p>{{ ind.industrycount }} Jobs</p>
    </div>
  </div>
</section>
