<nav class="navbar">
  <!-- Logo -->
  <div class="brand">
    <img src="assets/Logo/Jobify.png" alt="Jobify Logo" class="logo" />
    <!-- <span class="brand-name">Jobify</span> -->
     <strong>Jobify</strong>
  </div>

  <!-- Menu -->
  <!-- <ul class="menu">
    <li class="item"><a routerLink="/Jobify/home">Home</a></li>
     <li class="item"><a routerLink="/Jobify/findjob">Find Job</a></li>


  </ul> -->
    <!-- SEARCH BAR -->
<div class="search-container"  #searchBox>

  <div class="search-bar" [class.focused]="isFocused">

    <!-- Icon -->
    <span class="icon">🔍</span>

  <input
  type="text"
  [(ngModel)]="keyword"
  name="keyword"
  placeholder="Search jobs, companies..."
  (input)="onInputChange()"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (keyup.enter)="onSearch()"
/>

    <!-- Location -->
    <div class="location">
      📍 Anywhere
    </div>

  </div>

  <!-- 🔥 Suggestions -->
  <div class="suggestions" *ngIf="showSuggestions && filteredSuggestions.length">

    <div 
      *ngFor="let item of filteredSuggestions"
      class="suggestion-item"
      (mousedown)="selectSuggestion(item)"
    >
      🔍 {{ item }}
    </div>

  </div>

</div>
  <!-- Right Side Icons -->
    <ul class="right-actions">
        <!-- Logged in -->
      <ng-container *ngIf="isLoggedIn">
      <img
    src="assets/LandImag/computer-worker.png"
    class="card-icon"
    alt="Employer"
  />
    

        <li><a class="logout-link" (click)="logout()">Logout</a></li>
      </ng-container>

      <!-- Not logged in -->
      <ng-container *ngIf="!isLoggedIn">
        <li><a routerLink="/login">Login</a></li>
        <li><a routerLink="/register">Register</a></li>
      </ng-container>

    </ul>
  
</nav>
