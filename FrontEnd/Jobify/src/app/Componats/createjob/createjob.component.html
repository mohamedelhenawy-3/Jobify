<div class="page-content">

<div class="job-form-container">

  <h2 class="form-title">Post a Job</h2>

  <form [formGroup]="jobForm" (ngSubmit)="submit()" class="job-form">

    <!-- Job Title -->
    <div class="form-group">
      <label for="title">Job Title</label>
      <input id="title" formControlName="title" placeholder="e.g., Frontend Developer" />
    </div>

    <!-- Job Description -->
    <div class="form-group">
      <label for="description">Job Description</label>
      <textarea id="description" formControlName="description" rows="5" placeholder="Describe the role and responsibilities"></textarea>
    </div>
       <div class="form-group">
      <label for="description">Job requirements</label>
      <textarea id="description" formControlName="requirements" rows="5" placeholder="Describe the role and responsibilities"></textarea>
    </div>
     <div class="form-group">
      <label for="description">Job responsibilities</label>
      <textarea id="description" formControlName="responsibilities" rows="5" placeholder="Describe the role and responsibilities"></textarea>
    </div>
    <div class="form-group">
      <label for="description">Job EducationOrExperience</label>
      <textarea id="description" formControlName="educationOrExperience" rows="5" placeholder="Describe the role and responsibilities"></textarea>
    </div>
  
    <!-- Location -->
    <div class="form-group">
      <label for="location">Location</label>
      <input id="location" formControlName="location" placeholder="e.g., Cairo, Egypt" />
    </div>

    <!-- Salary Row -->
    <div class="form-row">
      <div class="form-group">
        <label for="minSalary">Min Salary</label>
        <input type="number" id="minSalary" formControlName="minSalary" placeholder="e.g., 2000" />
      </div>
      <div class="form-group">
        <label for="maxSalary">Max Salary</label>
        <input type="number" id="maxSalary" formControlName="maxSalary" placeholder="e.g., 18000" />
      </div>
    </div>


     
    <!-- Dropdowns Row -->
    <div class="form-row">
      <div class="form-group">
        <label for="industryId">Industry</label>
        <select id="industryId" formControlName="industryId">
          <option value="">Select Industry</option>
          <option *ngFor="let i of industries" [value]="i.id">{{ i.industryName }}</option>
        </select>
      </div>
        <div class="form-group">
        <label for="statusId">Status </label>
        <select id="statusId" formControlName="statusId">
          <option value="">Select Status </option>
          <option *ngFor="let t of JobStatus" [value]="t.id">{{ t.statusName }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="employmentTypeId">Employment Type</label>
        <select id="employmentTypeId" formControlName="employmentTypeId">
          <option value="">Select Employment Type</option>
          <option *ngFor="let t of employmentTypes" [value]="t.id">{{ t.typeName }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="workModeId">Work Mode</label>
        <select id="workModeId" formControlName="workModeId">
          <option value="">Select Work Mode</option>
          <option *ngFor="let w of workModes" [value]="w.id">{{ w.name }}</option>
        </select>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-btn">Post Job</button>

  </form>
</div>
</div>
