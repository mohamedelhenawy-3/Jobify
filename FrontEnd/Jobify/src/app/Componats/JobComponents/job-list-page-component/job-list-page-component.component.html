<div class="job-list">
  <div *ngFor="let job of jobs" class="job-card">

    <!-- HEADER -->
    <div class="job-header">

      <!-- ICON -->
      <div class="job-icon">
        <i [class]="getJobIcon(job)"></i>
      </div>

      <!-- TITLE + LOCATION -->
      <div class="job-info">
        <h3 class="job-title">{{ job.title }}</h3>
        <span class="job-location">
          <i class="fas fa-map-marker-alt"></i>
          {{ job.location }}
        </span>
      </div>

    </div>
<!--  -->

   <!-- META -->
<div class="job-meta">

  <span class="badge industry">
    <i class="fas fa-industry"></i>
    {{ getIndustryName(job.industryId) }}
  </span>

  <span
    class="badge"
    [ngClass]="getWorkModeClass(job.workModeId)">
    {{ getWorkModeName(job.workModeId) }}
  </span>

  <span
    class="badge"
    [ngClass]="getEmploymentTypeClass(job.employmentTypeId)">
    {{ getEmploymentTypeName(job.employmentTypeId) }}
  </span>

</div>


    <!-- FOOTER -->
    <div class="job-footer">
      <span class="salary">
        <i class="fas fa-money-bill-wave"></i>
        {{ job.minSalary | number }} - {{ job.maxSalary | number }} EGP
      </span>

      <!-- <button class="apply-btn">
        <i class="fas fa-paper-plane"></i>
        Apply
      </button> -->
     <a  class="apply-btn" (click)="viewJob(job.id)">
        <i class="fas fa-paper-plane"></i>
        Job details
    </a>
     
    </div>

  </div>
</div>

<!-- PAGINATION -->
<div class="pagination">
  <button (click)="changePage(page - 1)" [disabled]="page === 1">
    Prev
  </button>

  <button
    *ngFor="let i of [].constructor(totalPages); let idx = index"
    (click)="changePage(idx + 1)"
    [class.active]="page === idx + 1">
    {{ idx + 1 }}
  </button>
  <button (click)="changePage(page + 1)" [disabled]="page === totalPages">
    Next
  </button>
</div>
