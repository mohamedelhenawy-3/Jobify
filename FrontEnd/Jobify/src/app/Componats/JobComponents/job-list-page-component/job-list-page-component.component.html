<div class="job-list">
  <div *ngFor="let job of jobs" class="job-card">
    
    <div class="job-header">
      <h3 class="job-title">{{ job.title }}</h3>
      <span class="job-location">{{ job.location }}</span>
    </div>

    <p class="job-description">
      {{ job.description }}
    </p>

    <div class="job-meta">
      <span>💼 Industry: {{ job.industryId }}</span>
      <span>📄 Type: {{ job.employmentTypeId }}</span>
    </div>

    <div class="job-footer">
      <span class="salary">
        {{ job.minSalary | number }} - {{ job.maxSalary | number }} EGP
      </span>

      <button class="apply-btn">Apply</button>
    </div>

  </div>
</div>

<!-- Pagination -->
<div class="pagination">
  <button (click)="changePage(page - 1)" [disabled]="page === 1">
    Prev
  </button>

  <button
    *ngFor="let i of [].constructor(totalPages); let idx = index"
    (click)="changePage(idx + 1)"
    [class.active]="page === idx + 1">
    {{ idx + 1 }}
  </button>

  <button (click)="changePage(page + 1)" [disabled]="page === totalPages">
    Next
  </button>
</div>
