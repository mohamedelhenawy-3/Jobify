<div class="job-page" style="display: flex; gap: 20px;">
  <div class="left" style="width: 250px;">
    <app-job-filter (filterChanged)="onFiltersApplied($event)"></app-job-filter>
  </div>

  <div class="right" style="flex: 1;">
    <app-job-list-page-component
      [jobs]="jobs"
      [page]="page"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)">
    </app-job-list-page-component>
  </div>
</div>
