<aside class="job-filter-sidebar">
  <div class="filter-section">
    <h4>Industries</h4>
    <div *ngFor="let industry of industries" class="filter-item">
      <input type="checkbox" [value]="industry.id" (change)="toggleIndustry(industry.id)" id="industry-{{industry.id}}">
      <label for="industry-{{industry.id}}">{{ industry.industryName }}</label>
    </div>
  </div>

  <div class="filter-section">
    <h4>Employment Types</h4>
    <div *ngFor="let type of employmentTypes" class="filter-item">
      <input type="checkbox" [value]="type.id"  (change)="toggleType(type.id)" id="type-{{type.id}}">
      <label for="type-{{type.id}}">{{ type.typeName }}</label>
    </div>
  </div>

  <div class="filter-section">
    <h4>Work Modes</h4>
    <div *ngFor="let mode of workModes" class="filter-item">
      <input type="checkbox"(change)="toggleMode(mode.id)" [value]="mode.id" id="mode-{{mode.id}}">
      <label for="mode-{{mode.id}}">{{ mode.name }}</label>
    </div>
  </div>

  <button (click)="applyFilters()" class="apply-button">Apply Filters</button>
</aside>
