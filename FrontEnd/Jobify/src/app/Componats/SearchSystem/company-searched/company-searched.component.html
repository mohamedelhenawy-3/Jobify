<div *ngIf="companies.length > 0; else noCompanies" class="companies-container">
  <div class="company-card" *ngFor="let c of companies">
    
    <div class="card-content-wrapper">
      <div class="logo-box">
        <img [src]="c.logoUrl || 'assets/default-logo.png'" 
             alt="{{c.companyName}}" 
             class="company-logo">
      </div>
      
      <div class="company-details">
        <div class="title-row">
          <h3 class="company-name">{{ c.companyName }}</h3>
          <span class="status-badge" *ngIf="c.isHiring">Hiring</span>
        </div>
        
        <p class="description">{{ c.description }}</p>
        
        <div class="meta-footer">
          <div class="meta-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>{{ c.location }}</span>
          </div>
          <div class="meta-dot"></div>
          <div class="meta-item">
            <i class="fas fa-users"></i>
            <span>{{ c.companySize }} employees</span>
          </div>
          <div class="meta-dot"></div>
          <div class="meta-item">
            <span class="industry-tag">{{ c.industry || 'Technology' }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card-actions">
      <button class="btn-visit-pro" (click)="viewCompany(c.id)">
        <span>Visit Profile</span>
        <i class="fas fa-external-link-alt"></i>
      </button>
    </div>
    
  </div>
</div>

<ng-template #noCompanies>
  <div class="empty-state-pro">
    <div class="icon-circle">
      <i class="fas fa-building"></i>
    </div>
    <h4>No companies found</h4>
    <p>Try adjusting your filters or search terms.</p>
  </div>
</ng-template>
