<div *ngIf="users.length > 0; else noUsers" class="users-container">
  <div class="user-card" *ngFor="let u of users">
    <img 
      [src]="u.profileImageUrl || 'assets/default-user.png'" 
      class="user-img"
      alt="User image"
    />
    <div class="user-info">
      <h4>{{ u.fullName }}</h4>
      <p class="headline">{{ u.headline || 'No headline' }}</p>
      <p class="location">{{ u.location }}</p>
    </div>
  </div>
</div>

<ng-template #noUsers>
  <p class="empty">No users found.</p>
</ng-template>
