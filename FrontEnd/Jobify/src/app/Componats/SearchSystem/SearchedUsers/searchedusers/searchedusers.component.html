<div class="users-container">

  <div class="user-card"
       *ngFor="let u of users">

    <img 
      [src]="u.profileImageUrl || 'assets/default-user.png'" 
      class="user-img"
      alt="User image"
    />

    <div class="user-info">
      <h4>{{ u.fullName }}</h4>
      <p class="headline">{{ u.headline }}</p>
      <p class="location">{{ u.location }}</p>
    </div>

  </div>

  <div *ngIf="users.length === 0" class="empty">
    No users found.
  </div>

</div>
