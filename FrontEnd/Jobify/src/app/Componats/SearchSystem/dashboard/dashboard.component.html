<div class="dashboard-wrapper">

  <!-- Top filters -->
  <div class="top-filter-section">
    <app-filter
     [searchDto]="searchDto"
     (filtersChange)="onGlobalFilterChange($event)">
    </app-filter>

    <app-jobbarfilter
      *ngIf="searchDto.type === 'job'"
      [industries]="industries"
      [workModes]="workModes"
      [EmploymentTypeIds]="EmploymentTypeIds"
      (filterChanged)="onJobFilterChange($event)">
     </app-jobbarfilter>

  </div>
  <div *ngIf="searchDto.type === 'job'" class="main-split-content">

  <!-- LEFT SIDE (LIST) -->
  <aside class="job-list-side">

    <div class="cards-container">
      <app-jobcard 
        *ngFor="let j of jobs"
        [job]="j"
        [isActive]="selectedJob?.id === j.id"
        (clicked)="selectedJob = j">
      </app-jobcard>
    </div>

    <div *ngIf="jobs.length === 0" class="p-4 text-center text-muted">
      No jobs found.
    </div>

  </aside>

  <!-- ✅ RIGHT SIDE (DETAILS) OUTSIDE -->
  <main class="job-details-side">
    <app-jobdetails [job]="selectedJob"></app-jobdetails>
  </main>

</div>
<app-searchedusers *ngIf="searchDto.type === 'user'"
  [users]="users">
</app-searchedusers>
<app-company-searched
  *ngIf="searchDto.type === 'company'"
  [companies]="companies">
</app-company-searched>
</div>
