


<div class="job-card" [class.active-card]="isActive" (click)="onCardClick()">
  <div class="card-header-row">
    <div class="logo-wrapper">
      <img [src]="job.logo || 'assets/default-company.png'" alt="logo">
    </div>

    <div class="job-main-header">
      <h6 class="job-title">{{ job.title }}</h6>
      <p class="company-name">{{ job.companyName }}</p>
    </div>
  </div>

  <div class="job-details-area">
    <p class="location">📍 {{ job.location }}</p>
    
    <div class="badges-row">
      <span class="badge industry">
        {{ getIndustryName(job.industryId) }}
      </span>
      <span class="badge" [ngClass]="getWorkModeClass(job.workModeId)">
        {{ getWorkModeName(job.workModeId) }}
      </span>
      <span class="badge" [ngClass]="getEmploymentTypeClass(job.employmentTypeId)">
        {{ getEmploymentTypeName(job.employmentTypeId) }}
      </span>
      <span class="time-ago">{{ job.createdAt | date:'shortDate' }}</span>
    </div>
  </div>
</div>
