<div class="dashboard-wrapper">
  
  <div class="top-filter-section">
    
    <app-jobbarfilter ...></app-jobbarfilter> 
  </div>

  <div class="main-split-content">
    
    <aside class="job-list-side">
      <div class="alert-subscription-box">
        <div class="alert-content">
          <div class="alert-info">
            <i class="fas fa-bell" [class.active-bell]="isAlertEnabled"></i>
            <div>
              <p class="m-0 fw-bold">Get job alerts</p>
            </div>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="isAlertEnabled" (change)="onToggleAlert()">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div class="cards-container">
        <app-jobcard 
          *ngFor="let j of jobs" 
          [job]="j"
          [isActive]="selectedJob?.id === j.id"
          (clicked)="selectedJob = j"> 
        </app-jobcard>
      </div>

      <div *ngIf="jobs.length === 0" class="p-4 text-center text-muted">
        No jobs found.
      </div>
    </aside>

    <main class="job-details-side">
      <app-jobdetails [job]="selectedJob"></app-jobdetails>
    </main>

  </div>
</div>
