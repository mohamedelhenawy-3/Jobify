<div class="Conatiner">
  <div class="EmployerCard">

    <!-- Back button -->
    <div class="back-btn" onclick="history.back()">
      ← Back
    </div>

    <!-- Switch Buttons -->
    <div class="switch">
      <button 
        [class.active]="userType === 'JobSeeker'"
        (click)="switch('JobSeeker')">
        Job Seeker
      </button>

      <button 
        [class.active]="userType === 'Employer'"
        (click)="switch('Employer')">
        Employer
      </button>
    </div>

    <!-- TITLE -->
    <h3 *ngIf="userType === 'JobSeeker'">Job Seeker Register</h3>
    <h3 *ngIf="userType === 'Employer'">Employer Register</h3>

 <form [formGroup]="registerForm" (ngSubmit)="submit()">
  <div class="registercard">

    <!-- Job Seeker -->
    <label *ngIf="userType === 'JobSeeker'">Full Name</label>
    <input
      *ngIf="userType === 'JobSeeker'"
      type="text"
      formControlName="fullName"
      placeholder="Enter your full name"
    />

    <!-- Email -->
    <label>Email</label>
    <input
      type="email"
      formControlName="email"
      placeholder="Enter your email"
    />
    <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
      Valid email is required
    </small>

    <!-- Password -->
    <label>Password</label>
    <input
      type="password"
      formControlName="password"
      placeholder="Enter password"
    />

    <!-- Employer Fields -->
    <div *ngIf="userType === 'Employer'">
      <label>Company Name</label>
      <input
        type="text"
        formControlName="companyName"
        placeholder="Company name"
      />

      <label>Company Website</label>
      <input
        type="text"
        formControlName="companyWebsite"
        placeholder="https://company.com"
      />
    </div>

    <div class="btn">
      <button type="submit" [disabled]="loading">
        Register as {{ userType }}
      </button>
    </div>

  </div>
</form>


    <!-- Sign In Link -->
    <div class="signin-section">
      <p>
        Already have an account?
        <a class="signin-link" routerLink="/login">Sign in</a>
      </p>
    </div>

  </div>
</div>
