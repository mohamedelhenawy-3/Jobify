<div class="container mt-4">
  <div class="header-section">
    <h4>Job Applications</h4>
    <span class="count-badge">{{ applications.length }} Total</span>
  </div>

  <div *ngIf="isLoading" class="loader-wrapper">
    <div class="spinner"></div>
    <p>Loading applications...</p>
  </div>

  <div *ngIf="!isLoading && !applications.length" class="no-data-card">
    <i class="fas fa-folder-open"></i>
    <p>No applications found yet.</p>
  </div>

  <div class="applications-list" *ngIf="!isLoading && applications.length">
    <div class="application-card" *ngFor="let app of applications">
      
      <div class="candidate-info">
        <div class="img-container">
          <img [src]="app.profileImageUrl || 'assets/default-user.png'" alt="Profile" class="profile-img">
          <span class="status-indicator" [ngClass]="app.status"></span>
        </div>
        <div class="candidate-text">
          <div class="name">{{ app.joSeekerFullName }}</div>
          <div class="email"><i class="far fa-envelope"></i> {{ app.joSeekerEmail }}</div>
        </div>
      </div>

      <div class="job-info">
        <div class="job-title">{{ app.jobTitle }}</div>
        <div class="applied-at"><i class="far fa-clock"></i> Applied {{ app.appliedAt | date:'mediumDate' }}</div>
      </div>

      <div class="action-section">
        <div class="status-container">
          <span class="status-badge" [ngClass]="app.status">
            {{ app.status }}
          </span>
       <select class="status-select" 
          [ngModel]="app.status" 
          (ngModelChange)="onStatusChange(app.applicationId, $event)">
    <option value="Applied">Applied</option>
    <option value="UnderReview">Under Review</option>
    <option value="Interviewed">Interviewed</option>
    <option value="Hired">Hired</option>
    <option value="Rejected">Rejected</option>
  </select>
        </div>
       <div class="mt-3 p-3 bg-light border-start border-warning border-4 rounded" 
             *ngIf="editingInterviewId === app.applicationId">
          <h6><i class="fas fa-calendar-check me-2"></i>Schedule Interview</h6>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="small fw-bold">Date & Time</label>
              <input type="datetime-local" class="form-control form-control-sm" 
                     [(ngModel)]="interviewForm.interviewDate">
            </div>
            <div class="col-md-6">
              <label class="small fw-bold">Location</label>
              <input type="text" class="form-control form-control-sm" 
                     placeholder="Office or Link" [(ngModel)]="interviewForm.interviewLocation">
            </div>
            <div class="col-12">
              <label class="small fw-bold">Internal Notes</label>
              <textarea class="form-control form-control-sm" rows="2" 
                        [(ngModel)]="interviewForm.notes"></textarea>
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-success btn-sm" (click)="saveStatus(app.applicationId, interviewForm)">
              Confirm Status
            </button>
            <button class="btn btn-link btn-sm text-secondary" (click)="editingInterviewId = null">
              Cancel
            </button>
          </div>
        </div>
        
        <button class="view-btn" (click)="viewDetails(app.applicationId)">
          Details
        </button>
      </div>

    </div>
  </div>
</div>
