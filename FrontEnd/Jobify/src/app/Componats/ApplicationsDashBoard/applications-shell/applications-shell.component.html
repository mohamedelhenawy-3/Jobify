<app-applicationfilters 
    (onStatusChnage)="handleFilterChange($event)">
</app-applicationfilters>

<div class="content-area">
  
  <app-applications 
    *ngIf="userRole === 'Employer'"
    [applications]="applications"
    [isLoading]="loading"
    (onStatusUpdated)="loadData()">
  </app-applications>

  <div class="applications-grid" *ngIf="userRole === 'JobSeeker'">
    <div *ngIf="loading" class="spinner"></div>
    <app-jobseekerapplications 
      *ngFor="let item of applications" 
      [data]="item">
    </app-jobseekerapplications>
  </div>

</div>
