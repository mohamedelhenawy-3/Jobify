<div class="application-card" *ngFor="let app of applications">
  
  <div class="card-top-row">
    <div class="job-brand-wrapper">
      <div class="logo-box">
        <img *ngIf="app.logo; else noLogo" 
             [src]="app.logo" 
             alt="{{ app.companyName }}" 
             class="company-logo">
        <ng-template #noLogo>
          <div class="logo-placeholder">{{ app.companyName?.charAt(0) }}</div>
        </ng-template>
      </div>
      
      <div class="title-column">
        <h3 class="job-title">{{ app.jobTitle }}</h3>
        <p class="company-name">{{ app.companyName }}</p>
      </div>
    </div>

    <span class="status-badge" [ngClass]="getStatusClass(app.status)">
      <span class="status-dot"></span>
      {{ app.status }}
    </span>
  </div>

  <div class="meta-row">
    <span class="meta-pill">
      <i class="fas fa-map-marker-alt"></i> {{ app.jobLocation }}
    </span>
    <span class="meta-pill">
      <i class="fas fa-briefcase"></i> {{ app.workMode }}
    </span>
  </div>

  <div class="card-footer">
    <div class="date-group">
      <span class="label">Applied on</span>
      <span class="date">{{ app.appliedAt | date: 'mediumDate' }}</span>
    </div>
    <button class="view-details-btn">
      Details <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>
