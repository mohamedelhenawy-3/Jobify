<div class="card-container">
  <div class="card-header">
    <div class="brand-section">
      <div class="logo-wrapper">
        <img [src]="data.logo || 'assets/images/default-company.png'" 
             [alt]="data.companyName"
             class="company-logo">
      </div>
      <div class="title-meta">
        <h3 class="job-title" [title]="data.jobTitle">{{ data.jobTitle }}</h3>
        <p class="company-name">{{ data.companyName }}</p>
      </div>
    </div>
    
    <div class="status-indicator" [ngClass]="getStatusClass(data.status)">
      <span class="dot"></span>
      {{ data.status }}
    </div>
  </div>

  <div class="card-body">
    <div class="info-pill">
      <span>📍 {{ data.jobLocation }}</span>
    </div>
    <div class="info-pill">
      <span>💼 {{ data.workMode }}</span>
    </div>
    <div class="info-pill">
      <span>⏱️ {{ data.employmentType }}</span>
    </div>
  </div>

  <div class="card-footer">
    <span class="applied-at">Applied on {{ data.appliedAt | date:'mediumDate' }}</span>
    <button class="details-btn">
      View Details
    </button>
  </div>
</div>
