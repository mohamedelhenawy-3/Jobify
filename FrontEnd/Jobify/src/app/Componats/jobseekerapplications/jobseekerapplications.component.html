<div class="app-card">

  <div class="app-header">
    <div class="logo-box">
      <img
        *ngIf="data.logo; else fallbackLetter"
        [src]="data.logo"
        [alt]="data.companyName"
      />
      <ng-template #fallbackLetter>
        <span class="fallback-text">{{ data.companyName[0] }}</span>
      </ng-template>
    </div>

    <div class="title-section">
      <h3 class="job-title">{{ data.jobTitle }}</h3>
      <p class="company-name">{{ data.companyName }}</p>
    </div>
  </div>

  <div class="app-meta">
    <div class="meta-row">
      <i class="fas fa-map-marker-alt icon"></i>
      <span class="text">{{ data.jobLocation || 'Remote' }}</span>
    </div>

    <div class="meta-row" \>
      <i class="fas fa-dollar-sign icon"></i>
      <span class="text">10203</span>
    </div>

    <div class="meta-row">
      <i class="fas fa-calendar-alt icon"></i>
      <span class="text">Applied {{ data.appliedAt | date:'MMM d, y' }}</span>
    </div>
  </div>

  <div class="status-wrapper">
    <span class="status-badge" [ngClass]="getStatusClass(data.status)">
      {{ data.status }}
    </span>
  </div>

</div>
