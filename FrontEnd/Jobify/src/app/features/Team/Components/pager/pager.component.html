<div class="pager" *ngIf="totalPages > 1">
  <button type="button" (click)="pageChange.emit(page - 1)" [disabled]="page <= 1">Previous</button>
  <span>Page {{ page }} of {{ totalPages }} · {{ totalCount }} results</span>
  <button type="button" (click)="pageChange.emit(page + 1)" [disabled]="page >= totalPages">Next</button>
</div>
