<footer class="footer">
  <div class="inner">
    <div class="top">
      <div class="brand">
        <a class="logo" routerLink="/">
          <span class="mark">J</span>
          Jobify
        </a>
        <p>
          Connecting talented people with great companies.
          Find your next role or your next hire in minutes.
        </p>

        <div class="social">
          <a href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3zM9.75 9.75h3.8v1.54h.05c.53-1 1.82-2.05 3.75-2.05 4 0 4.75 2.63 4.75 6.05V21h-4v-4.9c0-1.17-.02-2.67-1.63-2.67-1.63 0-1.88 1.27-1.88 2.58V21h-4z"/>
            </svg>
          </a>
          <a href="#" aria-label="X">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M18.244 2H21.5l-7.1 8.12L22.75 22h-6.54l-5.12-6.7L5.2 22H1.94l7.6-8.68L1.5 2h6.7l4.63 6.1L18.244 2zm-1.14 18h1.8L7.05 3.9H5.12L17.104 20z"/>
            </svg>
          </a>
          <a href="#" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M13.5 22v-8.2h2.8l.4-3.2h-3.2V8.6c0-.9.3-1.6 1.6-1.6h1.7V4.2c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H7.3v3.2h2.8V22z"/>
            </svg>
          </a>
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
            </svg>
          </a>
        </div>
      </div>

      <nav class="col" *ngFor="let c of columns" [attr.aria-label]="c.title">
        <h4>{{ c.title }}</h4>
        <ul>
          <li *ngFor="let l of c.links">
            <a [routerLink]="l.url">{{ l.label }}</a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="bottom">
      <p>&copy; {{ year }} Jobify. All rights reserved.</p>
      <div class="legal">
        <a routerLink="/privacy">Privacy</a>
        <a routerLink="/terms">Terms</a>
        <a routerLink="/contact">Contact</a>
      </div>
    </div>
  </div>
</footer>
